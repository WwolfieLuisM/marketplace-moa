# Keep-alive del backend en Render (free tier).
#
# Render free duerme el servicio tras ~15 min sin peticiones; el primer request
# posterior tarda ~50 s en despertarlo (cold start). Este cron manda un GET a la
# raíz (`GET /` responde JSON sin tocar la DB) cada 10 min para que nunca duerma
# en horario hábil.
#
# Notas:
# - El cron va desfasado 7 min (minutos 7,17,...) a propósito: GitHub retrasa
#   los cron en los minutos "redondos" (:00, :10, ...) por congestión; el
#   desfase evita esa cola. El hueco entre runs sigue siendo 10 min.
# - GitHub pausa automáticamente los cron de un repo tras 60 días sin actividad:
#   si el proyecto queda quieto, reactivar en la pestaña Actions del repo.
# - No usa secretos: `GET /` es público.

name: Keep-alive API (Render free)

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar API
        run: |
          curl -sS -f --max-time 120 -w "\nHTTP %{http_code} en %{time_total}s\n" \
            https://moa-api-8y3i.onrender.com/
