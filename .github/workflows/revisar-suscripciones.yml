name: Revisar suscripciones diarias

on:
  schedule:
    # 05:00 UTC = ~medianoche en Cuba (America/Havana): el "día" del negocio.
    # La zona de Cuba tiene DST, así que en verano cae a la 01:00 local: el
    # contador diario se resuelve solo por clave de día en el backend.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  revisar-suscripciones:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar job de mantenimiento de suscripciones
        run: |
          curl -sS -f -X POST \
            -H "X-Job-Key: ${{ secrets.JOB_SECRET_KEY }}" \
            https://moa-api-8y3i.onrender.com/admin/jobs/revisar-suscripciones