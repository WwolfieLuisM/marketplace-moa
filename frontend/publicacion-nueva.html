<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F3B32">
<title>Nueva publicación — Marketplace Moa</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/moa.css">
</head>
<body>

<div id="header-mount"></div>

<main class="main-page main-narrow">

  <a href="feed.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 3l-5 5 5 5"/></svg>
    Volver al feed
  </a>

  <div class="feed-hdr"><h2>Nueva publicación</h2></div>

  <div class="info-note" id="infoLimites">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><path d="M10 9.5V14M10 6.2v.2"/></svg>
    <p id="infoTexto">Cargando tus límites del plan…</p>
  </div>

  <form id="pubForm" class="form-paper" novalidate>

    <label class="field">
      <span class="field-label">Título de la publicación</span>
      <input type="text" name="titulo" id="fTitulo" placeholder="Ej: Vendo artículos de tecnología" required>
    </label>

    <div class="row2">
      <label class="field">
        <span class="field-label">Reparto</span>
        <select id="fReparto" class="select-board" required></select>
      </label>
      <div style="display:flex;flex-direction:column;justify-content:flex-end;gap:6px">
        <label class="checkbox-field" style="margin:0">
          <input type="checkbox" id="fDomicilio">
          <span>Entrega a domicilio</span>
        </label>
        <label class="field" style="margin:0">
          <span class="field-label">Teléfono (opcional)</span>
          <input type="text" id="fTelefono" placeholder="Ej: 5355555555" inputmode="numeric">
        </label>
      </div>
    </div>

    <div class="prods-section">
      <div class="section-lbl">
        Productos <span class="count-chip" id="countChip">1/3</span>
      </div>
      <div id="prodsWrap"></div>
    </div>

    <button type="button" class="btn-ghost btn-block" id="addProdBtn" style="justify-content:center">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Agregar otro producto
    </button>

    <button type="submit" class="btn-cta btn-block">
      <span class="btn-label">Publicar</span>
      <span class="btn-spinner"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
    </button>
  </form>

</main>

<div id="nav-mount"></div>

<script src="js/partials.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="partials/header.js"></script>
<script src="partials/nav.js"></script>
<script>
  cargarPartial('#header-mount', 'partials/header.html');
  cargarPartial('#nav-mount', 'partials/nav.html');
</script>
<script>
(function initPublicacionNueva() {
  const PROD_MAX = 3;
  const FOTO_MAX = 3;
  const TAM_MAX = 1200;

  const rep = document.getElementById('fReparto');
  REPARTOS.forEach((r) => {
    const o = document.createElement('option');
    o.value = r; o.textContent = r;
    rep.appendChild(o);
  });

  let categorias = [];
  async function cargarCategorias() {
    try {
      const { categorias: cats } = await api.get('/feed/categorias');
      categorias = cats;
      const opts = categorias.map((c) => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
      Array.from(prodsWrap.querySelectorAll('[data-categoria]')).forEach((sel) => {
        const actual = sel.value;
        sel.innerHTML = `<option value="">Selecciona…</option>${opts}`;
        if (actual) sel.value = actual;
      });
    } catch (e) {
      categorias = [];
    }
  }

  cargarCategorias();

  async function cargarLimites() {
    const infoTexto = document.getElementById('infoTexto');
    try {
      const { perfil } = await api.get('/vendedores/me');
      if (perfil.estadoSuscripcion === 'demo') {
        infoTexto.innerHTML = `Publicaste <strong>${perfil.productosHoy ?? 0} de 5</strong> hoy y llevas <strong>${perfil.productosTotalDemo ?? 0} de 10</strong> en total. Cada producto puede incluir hasta <strong>3 fotos</strong>.`;
      } else {
        infoTexto.textContent = 'Tu plan está activo. Cada publicación puede incluir hasta 3 productos y 3 fotos por producto.';
      }
    } catch (e) {
      infoTexto.textContent = 'Solo los vendedores con licencia aprobada pueden publicar.';
    }
  }

  // --- editores de producto ---
  const prodsWrap = document.getElementById('prodsWrap');
  const countChip = document.getElementById('countChip');
  let idxGlobal = 0;

  function agregarEditor() {
    const idx = idxGlobal++;
    const editor = document.createElement('div');
    editor.className = 'prod-editor card';
    editor.dataset.idx = idx;
    editor.innerHTML = `
      <div class="prod-editor-head">
        <span>Producto ${idx + 1}</span>
        <button type="button" class="icon-xs-btn" data-quit>
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <label class="field">
        <span class="field-label">Nombre del producto</span>
        <input type="text" data-nombre placeholder="Ej: Samsung Galaxy A15" required>
      </label>
      <label class="field">
        <span class="field-label">Descripción</span>
        <textarea data-desc rows="2" placeholder="Estado, marca, detalles..." required></textarea>
      </label>
      <div class="row2">
        <label class="field">
          <span class="field-label">Precio en CUP</span>
          <input type="number" data-precio placeholder="18000" min="0" inputmode="numeric" required>
        </label>
        <label class="field">
          <span class="field-label">Cantidad</span>
          <input type="number" data-cantidad value="1" min="0" inputmode="numeric" required>
        </label>
      </div>
      <label class="field">
        <span class="field-label">Categoría</span>
        <select data-categoria class="select-board">
          <option value="">Selecciona…</option>
          ${categorias.length ? categorias.map((c) => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('') : ''}
        </select>
      </label>
      <div class="fotos-row" data-fotos></div>
      <span class="pw-hint">Máximo 3 fotos por producto.</span>`;

    // slots de foto
    const fotosRow = editor.querySelector('[data-fotos]');
    const fotos = [];
    for (let s = 0; s < FOTO_MAX; s++) {
      const slot = document.createElement('label');
      slot.className = 'foto-add';
      if (fotos.length) slot.style.display = 'none';
      slot.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>${fotos.length ? 'Agregar foto' : 'Agregar foto'}</span>
        <input type="file" accept="image/png,image/jpeg,image/webp" hidden>`;
      const input = slot.querySelector('input');
      input.addEventListener('change', async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const dataUri = await redimensionar(file);
          fotos.push(dataUri);
          slot.style.display = 'none';
          const next = fotosRow.children[fotos.length];
          if (next) next.style.display = 'flex';
          fotosRow.insertAdjacentHTML('beforeend', `
            <div class="foto-pick"><img src="${dataUri}" alt=""><button type="button" class="icon-xs-btn" data-x><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>`);
          const xB = fotosRow.lastElementChild.querySelector('[data-x]');
          xB.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); quitarFoto(fotos.length - 1); });
        } catch (err) {
          alert('No se pudo cargar la foto: ' + (err.message || 'archivo inválido'));
        }
      });
      slot.addEventListener('click', () => input.click());
      fotosRow.appendChild(slot);
    }

    function quitarFoto(i) {
      fotos.splice(i, 1);
      fotosRow.querySelectorAll('.foto-pick').forEach((el) => el.remove());
      fotos.forEach((f) => {
        fotosRow.insertAdjacentHTML('beforeend', `<div class="foto-pick"><img src="${f}" alt=""><button type="button" class="icon-xs-btn" data-x><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>`);
        fotosRow.lastElementChild.querySelector('[data-x]').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); quitarFoto(fotos.indexOf(f)); });
      });
      Array.from(fotosRow.children).forEach((el, i2) => { if (el.classList.contains('foto-add')) el.style.display = i2 === fotos.length ? 'flex' : 'none'; });
    }

    editor.querySelector('[data-quit]').addEventListener('click', () => {
      editor.remove();
      renumerar();
    });

    prodsWrap.appendChild(editor);
    renumerar();
  }

  function renumerar() {
    Array.from(prodsWrap.querySelectorAll('.prod-editor')).forEach((el, i) => {
      el.querySelector('.prod-editor-head span').textContent = `Producto ${i + 1}`;
      el.dataset.idx = i;
    });
    const n = prodsWrap.querySelectorAll('.prod-editor').length;
    countChip.textContent = `${n}/${PROD_MAX}`;
    document.getElementById('addProdBtn').style.display = n >= PROD_MAX ? 'none' : 'flex';
    prodsWrap.querySelectorAll('[data-quit]').forEach((b) => { b.style.display = n <= 1 ? 'none' : 'inline-flex'; });
  }

  function redimensionar(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const escala = Math.min(1, TAM_MAX / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * escala);
          canvas.height = Math.round(img.height * escala);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = () => reject(new Error('imagen inválida'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('no se pudo leer el archivo'));
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('addProdBtn').addEventListener('click', agregarEditor);
  agregarEditor();

  // --- envío ---
  const form = document.getElementById('pubForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      const productos = Array.from(prodsWrap.querySelectorAll('.prod-editor')).map((el) => {
        const fotos = [];
        el.querySelectorAll('.foto-pick img').forEach((img) => fotos.push(img.src));
        return {
          nombre: el.querySelector('[data-nombre]').value.trim(),
          descripcion: el.querySelector('[data-desc]').value.trim(),
          precio: Number(el.querySelector('[data-precio]').value),
          cantidad: Number(el.querySelector('[data-cantidad]').value || 0),
          categoriaId: Number(el.querySelector('[data-categoria]').value),
          fotos,
        };
      });
      if (!document.getElementById('fTitulo').value.trim()) throw new Error('Falta el título');
      const { publicacion } = await api.post('/publicaciones', {
        titulo: document.getElementById('fTitulo').value.trim(),
        reparto: document.getElementById('fReparto').value,
        conDomicilio: document.getElementById('fDomicilio').checked,
        telefonoMovil: document.getElementById('fTelefono').value.trim() || null,
        productos,
      });
      location.href = `publicacion.html?id=${publicacion.id}`;
    } catch (err) {
      alert(err.message || 'No se pudo publicar. Revisa los campos e inténtalo de nuevo.');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });

  esperarSesion().then(async (u) => {
    if (!u) { if (window.openAuth) openAuth(); else location.href = 'login.html'; return; }
    await cargarLimites();
  });
})();
</script>
</body>
</html>
