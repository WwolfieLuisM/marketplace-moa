<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F3B32">
<title>Guardados — Marketplace Moa</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/moa.css">
</head>
<body>

<div id="header-mount"></div>

<main class="main-page">
  <div class="feed-hdr">
    <h2>Mis guardados <span id="favCount" style="color:var(--chalk-dim);font-weight:400"></span></h2>
    <a href="feed.html" class="back-link" style="padding:0">Ver feed</a>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div id="nav-mount"></div>

<script src="js/partials.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="partials/header.js"></script>
<script src="partials/nav.js"></script>
<script>
  cargarPartial('#header-mount', 'partials/header.html');
  cargarPartial('#nav-mount', 'partials/nav.html');
</script>
<script>
(function initFavoritos() {
  const grid = document.getElementById('grid');
  const favCount = document.getElementById('favCount');

  async function render() {
    grid.innerHTML = '<div class="grid-skeleton">Cargando guardados…</div>';
    try {
      const favoritos = await api.get('/favoritos');
      favCount.textContent = `(${favoritos.length})`;
      if (!favoritos.length) {
        grid.innerHTML = `
          <div class="grid-skeleton">
            Aún no tienes guardados.<br>
            <a href="feed.html" style="color:var(--chalk);text-decoration:underline">Explora el feed</a> y guarda los productos que te gusten.
          </div>`;
        return;
      }
      grid.innerHTML = favoritos.map((p) => moaProdCard(p, true, true)).join('');
      bindGrid(grid);
      bindFav(grid);
    } catch (e) {
      grid.innerHTML = '<div class="grid-skeleton">No se pudieron cargar tus guardados.</div>';
    }
  }

  esperarSesion().then((u) => { if (!u) { location.href = 'login.html'; return; } render(); });
})();
</script>
</body>
</html>
