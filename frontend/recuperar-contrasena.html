<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F3B32">
<title>Recuperar contraseña — Marketplace Moa</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/moa.css">
</head>
<body class="auth-body">

<div class="window-card">
  <div class="window-bar">
    <div class="window-dots"><span class="wd"></span><span class="wd"></span><span class="wd"></span></div>
    <a href="login.html">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </a>
  </div>

  <div class="form-body">
    <div class="brand-mark"><span class="m1">moa</span><span class="m2">mercado</span></div>
    <h1 class="form-title">Recuperar contraseña</h1>
    <p class="form-sub">Escribe tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>

    <form id="recForm" novalidate>
      <div class="error-box" id="recError">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
        <span id="recErrorText"></span>
      </div>

      <label class="field">
        <span class="field-label">Correo electrónico</span>
        <input type="email" name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
      </label>

      <button type="submit" class="btn-cta btn-block">
        <span class="btn-label">Enviar enlace</span>
        <span class="btn-spinner"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      </button>
    </form>

    <p class="form-footer"><a href="login.html">Volver a iniciar sesión</a></p>
  </div>
</div>

<div class="overlay" id="okModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="okTitle">
    <div class="sheet-body center">
      <div class="ok-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>
      </div>
      <h2 id="okTitle" style="font-size:20px;margin:0 0 6px">Revisa tu correo</h2>
      <p style="font-size:14px;color:var(--ink-soft);line-height:1.5">Si existe una cuenta con ese correo, recibirás un enlace para restablecer tu contraseña.</p>
      <a href="login.html" class="btn-cta" style="width:100%;justify-content:center">Entendido</a>
    </div>
    <button class="close-btn" aria-label="Cerrar" onclick="location.href='login.html'">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
</div>

<script src="js/api.js"></script>
<script>
const form = document.getElementById('recForm');
const recError = document.getElementById('recError');
const recErrorText = document.getElementById('recErrorText');
const modal = document.getElementById('okModal');

form.addEventListener('submit', async e => {
  e.preventDefault();
  recError.classList.remove('visible');
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.classList.add('loading');
  try {
    await api.post('/auth/olvide-password', { email: form.querySelector('input[name="email"]').value.trim() });
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => modal.classList.add('open'));
  } catch (error) {
    recErrorText.textContent = error.message || 'No se pudo enviar el correo. Intenta de nuevo.';
    recError.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
});
</script>
</body>
</html>
