# Blueprint de Render para alojar el backend del Marketplace Moa (free tier).
# Uso: conectar el repo a Render y Render lee este archivo automáticamente
# (o desplegar manualmente: New Web Service → repo → rootDir backend).
#
# Las variables marcadas con `sync: false` NO se escriben en este archivo:
# se rellenan a mano en el dashboard (Dashboard → Service → Environment)
# con los mismos valores que hay en backend/.env (los secretos no se
# versionan). Las no sensibles quedan definidas aquí.

services:
  - type: web
    name: moa-api
    runtime: node
    plan: free
    repo: https://github.com/WwolfieLuisM/marketplace-moa
    branch: main
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      # URL del servicio Render: se reemplaza tras el primer deploy con la URL real.
      - key: NEXT_PUBLIC_API_URL
        value: https://moa-api-8y3i.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JOB_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false